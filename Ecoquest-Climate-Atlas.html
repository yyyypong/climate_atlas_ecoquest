<style id="eq-playfeel">
/* Tabletop climate circuit: felt board, ivory dice, paper ledger.
   Optimize hierarchy & desire to play — keep guidance, clarify focus. */
:root{
  --page:#f2eee4;
  --paper:#fbf8f1;
  --raised:#efe8da;
  --ink:#1a221e;
  --secondary:#556058;
  --muted:#727b74;
  --rule:#d4cdbf;
  --accent:#1f5a45;
  --accent-ink:#143c2e;
  --gold:#b8892d;
  --felt:#143832;
  --felt-2:#1c4840;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{
  background:
    radial-gradient(1000px 420px at 8% -8%,#ebe3d2 0%,transparent 58%),
    radial-gradient(800px 360px at 100% 0%,#e4ebe4 0%,transparent 52%),
    var(--page);
  color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.55;
}
h1,h2,.brand,.delegate-name,.standings-title,.dice-result-label,.dice-tray-copy strong{
  font-family:Georgia,"Iowan Old Style","Songti SC","SimSun",serif;
  font-weight:600;
  letter-spacing:-.01em;
}
.kicker{
  display:flex!important;gap:8px;align-items:center;
  font-size:12px;font-weight:500;letter-spacing:.02em;
  text-transform:none;color:var(--gold);margin-bottom:4px;
}
.kicker i{width:18px;height:1px;background:var(--gold);opacity:.7}
.mast{margin-bottom:16px;gap:16px;align-items:flex-end}
.mast h1{font-size:30px;line-height:1.25;font-weight:600;color:var(--ink)}
.mast .intro{max-width:40rem;font-size:15px;color:var(--secondary);margin-top:6px;line-height:1.55}
.session-label{font-size:12px;color:var(--muted);margin-bottom:4px}

/* Clear turn roadmap */
.turn-guide{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:12px 16px;margin-bottom:16px;
  background:var(--paper);border:1px solid var(--rule);border-radius:14px;
}
.turn-caption{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--secondary)}
.turn-caption b{color:var(--ink);font-family:Georgia,"Songti SC",serif;font-weight:600}
.route-node{
  width:10px;height:10px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 0 3px rgba(184,137,45,.2);
}
.turn-steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex:1;justify-content:center;flex-wrap:wrap}
.turn-steps li{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
  padding:4px 8px;border-radius:999px;
}
.turn-steps li>span{
  width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--raised);border:1px solid var(--rule);font-size:12px;font-variant-numeric:tabular-nums;
}
.turn-steps li[aria-current="step"]{color:var(--accent-ink);background:#e5efe9;font-weight:500}
.turn-steps li[aria-current="step"]>span{background:var(--accent);color:#fff;border-color:var(--accent)}
.turn-steps li.done{color:var(--secondary)}
.turn-steps li.done>span{background:#dce8e1;color:var(--accent);border-color:#c5d6cc}

.board{background:var(--felt);border-color:#234740;border-radius:16px;overflow:hidden}
.board-head,.board-foot{background:linear-gradient(180deg,var(--felt-2),var(--felt));border-color:#2d564d}
.mark.on{background:var(--gold)}

/* First-turn coach — helps beginners without hiding other panels */
.play-coach{
  display:flex;gap:12px;align-items:flex-start;
  margin:0 0 16px;padding:14px 16px;
  background:linear-gradient(180deg,#f7f1e4,#f3ecdc);
  border:1px solid #d9cbae;border-radius:14px;color:var(--ink);
}
.play-coach .coach-mark{
  width:28px;height:28px;border-radius:50%;flex:none;
  display:grid;place-items:center;background:var(--gold);color:#fff;
  font-family:Georgia,serif;font-size:14px;font-weight:600;
}
.play-coach strong{display:block;font-size:15px;margin-bottom:2px}
.play-coach p{margin:0;font-size:14px;color:var(--secondary);line-height:1.5}

.desk{
  display:grid;grid-template-columns:1fr;gap:0;padding:16px;
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
}
.desk .panel-head{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats .stat{
  background:var(--raised);border:1px solid var(--rule);border-radius:10px;
  padding:10px 8px;text-align:center;
}
.stats .stat span{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--secondary);margin-bottom:2px}
.stats .stat b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.turn-hint{font-size:14px;color:var(--secondary);margin:0 0 12px;line-height:1.5}
.cta{
  width:100%;min-height:52px;border-radius:12px;padding:12px 16px;
  background:var(--accent);color:#f7faf7;font-size:16px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
}
.cta:hover{background:#174836}
.cta:disabled{opacity:.55}
.cta.cta-roll{background:#1a4f3c;font-size:17px;min-height:56px}
.action-links{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.desk-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ability-entry{
  margin-top:12px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  border:1px dashed var(--rule);background:transparent;color:var(--secondary);font-size:13px;
  display:flex;justify-content:space-between;gap:8px;
}
.ability-entry:hover{background:var(--raised);color:var(--ink)}

/* Dice tray — always a physical object on the desk */
.dice-tray{
  margin:12px 0 4px;padding:16px 14px;border-radius:14px;
  background:
    radial-gradient(120px 80px at 18% 40%,rgba(255,255,255,.08),transparent 60%),
    linear-gradient(165deg,#25564c,#143832 70%);
  border:1px solid #2f5f55;color:#eef4ef;
  display:flex;align-items:center;gap:16px;
}
.dice-tray.is-waiting{box-shadow:inset 0 0 0 1px rgba(184,137,45,.35)}
.dice-tray-copy{flex:1;min-width:0}
.dice-tray-copy strong{display:block;font-size:17px;font-weight:600;margin-bottom:4px;color:#fff}
.dice-tray-copy span{font-size:13px;color:#c5d6cf;line-height:1.45}

/* ---------- 3D physical die: throw · tumble · decelerate · land flat ---------- */
.die-scene{
  position:relative;width:100%;height:100%;
  perspective:var(--die-persp,900px);
}
.die-world{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:translateY(var(--die-drop,54px)) rotateX(var(--die-tilt,58deg));
}
.die-desk{
  position:absolute;left:50%;top:50%;width:340px;height:238px;margin:-119px 0 0 -170px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 26%,rgba(255,255,255,.13),rgba(0,0,0,.26) 60%,rgba(0,0,0,0) 76%);
  box-shadow:inset 0 0 80px rgba(0,0,0,.30);
}
.die-shadow{
  position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,.15) 56%,rgba(0,0,0,0) 78%);
  opacity:.34;transform:translate3d(0,0,1px);
}
.die-flight{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:translate3d(var(--die-x,0px),var(--die-y,0px),var(--die-h,var(--die-z,44px)));
  will-change:transform;
}
.die-cube{
  position:absolute;left:0;top:0;width:calc(var(--die-z,44px) * 2);height:calc(var(--die-z,44px) * 2);
  margin:calc(var(--die-z,44px) * -1) 0 0 calc(var(--die-z,44px) * -1);
  transform-style:preserve-3d;will-change:transform;
  /* No filter on the cube. A filter is a grouping property: it flattens the 3D
     rendering context, so preserve-3d is defeated, backface-visibility stops
     hiding the far faces, and all six faces collapse onto a single plane.
     The die then reads as a flat card instead of a cube. The shadow is cast
     by the table contact shadow and by the shading on each face. */
}
.dice-face{
  position:absolute;inset:0;background:linear-gradient(145deg,#f8f3e8,#eae2d0);
  border-radius:12px;border:1px solid #d2c4a8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(80,60,30,.08);
  backface-visibility:hidden;
}
/* Face shading. The darkening is driven from JS with the face's real
   orientation, so the light stays in the room instead of riding along
   with the die as it spins. */
.dice-face::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:#22332b;opacity:var(--shade,0);z-index:0;
}
.dice-face .pips{position:absolute;inset:14%;display:grid;z-index:1}
.dice-face .pip{
  width:9px;height:9px;border-radius:50%;background:#211f1c;
  box-shadow:inset 0 1.5px 2px rgba(0,0,0,.55),inset 0 -1px 1.5px rgba(255,255,255,.42);
  justify-self:center;align-self:center;
}
.pips.n1{place-items:center}
.pips.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pips.n2 .pip:nth-child(1){grid-column:1;grid-row:1;justify-self:start;align-self:start}
.pips.n2 .pip:nth-child(2){grid-column:2;grid-row:2;justify-self:end;align-self:end}
.pips.n3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.pips.n3 .pip:nth-child(1){grid-column:1;grid-row:1;justify-self:start;align-self:start}
.pips.n3 .pip:nth-child(2){grid-column:2;grid-row:2}
.pips.n3 .pip:nth-child(3){grid-column:3;grid-row:3;justify-self:end;align-self:end}
.pips.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pips.n4 .pip:nth-child(1){justify-self:start;align-self:start}
.pips.n4 .pip:nth-child(2){justify-self:end;align-self:start}
.pips.n4 .pip:nth-child(3){justify-self:start;align-self:end}
.pips.n4 .pip:nth-child(4){justify-self:end;align-self:end}
.pips.n5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.pips.n5 .pip:nth-child(1){grid-column:1;grid-row:1;justify-self:start;align-self:start}
.pips.n5 .pip:nth-child(2){grid-column:2;grid-row:1;justify-self:end;align-self:start}
.pips.n5 .pip:nth-child(3){grid-column:1 / -1;grid-row:2}
.pips.n5 .pip:nth-child(4){grid-column:1;grid-row:3;justify-self:start;align-self:end}
.pips.n5 .pip:nth-child(5){grid-column:2;grid-row:3;justify-self:end;align-self:end}
.pips.n6{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.pips.n6 .pip:nth-child(odd){grid-column:1;justify-self:center}
.pips.n6 .pip:nth-child(even){grid-column:2;justify-self:center}
.die-scene .face-1{transform:translateZ(var(--die-z,44px))}
.die-scene .face-6{transform:rotateY(180deg) translateZ(var(--die-z,44px))}
.die-scene .face-3{transform:rotateY(90deg) translateZ(var(--die-z,44px))}
.die-scene .face-4{transform:rotateY(-90deg) translateZ(var(--die-z,44px))}
.die-scene .face-2{transform:rotateX(90deg) translateZ(var(--die-z,44px))}

/* the small die resting on the desk */

.mission{padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--rule)}

.dice-hint[hidden],.hidden{display:none!important}
.dice-hint{font-size:13px;color:#b7c9c2;margin:0}

.rank-podium{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.rank-card{
  display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;

.rank-points{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}

@media(max-width:760px){

  .rank-card{grid-template-columns:32px 1fr auto;gap:8px;padding:10px}

}
@media(prefers-reduced-motion:reduce){

/* ===== Dice v2 · flat ivory die on a felt tray, route preview ===== */
.die2d{position:relative;width:76px;height:76px;border-radius:18px;
  background:linear-gradient(150deg,#fffdf8 0%,#f3ecdc 62%,#e9dfca 100%);
  box-shadow:inset 0 -4px 0 rgba(120,95,50,.13),inset 0 2px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(150,125,80,.18);}
.die2d .pips{position:absolute;inset:18%;display:grid}
.die2d .pip{width:12px;height:12px;border-radius:50%;justify-self:center;align-self:center;
  background:radial-gradient(circle at 35% 30%,#3b4a42,#141c18 70%);box-shadow:inset 0 1px 1px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.7)}
.die2d .pips.n1 .pip{width:18px;height:18px;background:radial-gradient(circle at 35% 30%,#3c8a6b,#174a38 72%)}
.dice-stage{background:rgba(14,26,21,.52);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.roll-card{width:min(420px,100%);background:var(--paper);border:1px solid var(--rule);border-radius:22px;
  padding:26px 26px 22px;text-align:center;color:var(--ink);box-shadow:0 30px 80px rgba(8,18,14,.32),0 2px 0 rgba(255,255,255,.6) inset;
  animation:roll-card-in 320ms var(--ease) both}
@keyframes roll-card-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.roll-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.roll-kicker i{width:18px;height:1px;background:var(--gold);opacity:.7}
.roll-title{font-size:26px;margin:6px 0 0;font-weight:600;letter-spacing:.01em}
.roll-tray{position:relative;height:176px;margin:18px 0 18px;border-radius:16px;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 30%,#2a5e52 0%,#17423a 52%,#0f2f29 100%);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.05)}
.roll-tray::before{content:"";position:absolute;inset:10px;border-radius:11px;border:1px dashed rgba(240,196,112,.22);pointer-events:none}
.roll-tray::after{content:"";position:absolute;left:50%;top:22%;width:260px;height:120px;margin-left:-130px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent);pointer-events:none}
.roll-die-wrap{position:relative;width:76px;height:96px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.roll-die{will-change:transform;z-index:1;box-shadow:inset 0 -4px 0 rgba(120,95,50,.13),inset 0 2px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(150,125,80,.18),0 10px 18px rgba(0,0,0,.22)}
.roll-shadow{position:absolute;left:50%;bottom:2px;width:70px;height:12px;margin-left:-35px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);will-change:transform,opacity}
.roll-result{opacity:0;transform:translateY(6px);transition:opacity 260ms var(--ease),transform 260ms var(--ease)}
.roll-result.show{opacity:1;transform:none}
.roll-number{display:block;font-family:Georgia,"Songti SC","STSong",serif;font-size:54px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.roll-caption{display:block;margin-top:6px;font-size:13px;color:var(--secondary);letter-spacing:.04em}
.roll-route{display:flex;align-items:center;justify-content:center;gap:0;margin:16px auto 4px;padding:0;list-style:none;max-width:100%;font-size:13px}
.roll-route .place{white-space:nowrap;color:var(--muted);padding:0 8px;transition:color 240ms var(--ease)}
.roll-route .place.end{color:var(--ink);font-weight:600}
.roll-route .place.end.on{color:var(--accent)}
.roll-route .seg{flex:1 1 18px;max-width:30px;height:0;border-top:1.5px dashed var(--rule);transition:border-color 200ms var(--ease)}
.roll-route .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--paper);border:1.5px solid var(--rule);transition:all 200ms var(--ease)}
.roll-route .seg.on{border-top-color:var(--gold)}
.roll-route .dot.on{background:var(--gold);border-color:var(--gold);transform:scale(1.15)}
.roll-route .dot.last.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(31,90,69,.14)}
.roll-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:18px;border:0;border-radius:12px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:background 160ms var(--ease),transform 160ms var(--ease),opacity 220ms var(--ease)}
.roll-cta:hover{background:var(--accent-ink)}
.roll-cta:active{transform:translateY(1px)}
.roll-cta:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.roll-cta.waiting{opacity:0;pointer-events:none}
/* Standard pip layout: every face on the same 3x3 grid */

<body><a class="skip" href="#main">Skip to game · 进入游戏</a><header id="top"></header><div id="news-region" hidden></div><main id="main"></main><footer id="foot"></footer><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="dice-stage" class="dice-stage" hidden aria-modal="true" role="dialog" aria-labelledby="dice-stage-title"></div><div id="toast" role="status" aria-live="polite"></div><script>window.EQNewsSnapshot={"zh": {"items": [{"id": "9bd5549725a0bdf0", "title": "COP31：气候资金难满足需求，各方呼吁污染者“买单”", "summary": "第31届联合国气候变化大会（COP31）周五聚焦气候资金问题。联合国秘书长古特雷斯警告，即使将提供给脆弱国家的气候适应资金增至三倍，也只能满足其需求的不到三成。与会者呼吁富裕国家和主要污染者承担应有责任，为受气候灾害影响的国家和社区提供更多支持。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143200", "publishedAt": "2026-11-13T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "ee25acccb029a3c7", "title": "联合国环境署：空气污染不仅是环境问题，更是健康与经济危机", "summary": "第31届联合国气候变化大会举行之际，德里及印度北部多地再次被浓重雾霾笼罩。联合国环境规划署表示，空气污染已不仅是环境问题，更是一场影响公众健康和经济发展的危机。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143198", "publishedAt": "2026-11-13T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "688c2b7b9622126c", "title": "COP31聚焦城市韧性，敦促加快气候行动", "summary": "第31届联合国气候变化大会（COP31）领导人峰会周四举行了一场关于城市韧性、气候适应与行动的高级别对话。各国领导人、地方政府和金融机构代表共同探讨如何改善住房和基础设施，帮助城市居民抵御洪水、高温等气候灾害。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143189", "publishedAt": "2026-11-12T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "bae1ecbbb80dc155", "title": "孟加拉国和印度禁止使用剧毒农药百草枯 加强自杀预防和脑健康保护", "summary": "孟加拉国和印度于2026年9月宣布在全国范围内禁止使用剧毒农药百草枯。世界卫生组织称，这一监管措施预计将挽救成千上万人的生命，并保护脑健康。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143183", "publishedAt": "2026-11-12T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "b332d9e4b6e6edbf", "title": "联合国报告：全球70%的国家已建立多灾种早期预警系统", "summary": "联合国减少灾害风险办公室和世界气象组织周三发布的一份报告显示，全球已有136个国家具备某种多灾种早期预警系统能力，覆盖率达到70%，创历史新高。但最易受灾害影响的国家和社区仍存在重大缺口。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143181", "publishedAt": "2026-11-11T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "85e61477bd16e658", "title": "现在是决定成败的关键时刻：古特雷斯倡导达成气候正义契约", "summary": "联合国秘书长古特雷斯周三在第31届联合国气候变化大会（COP31）上倡导达成全球“气候正义契约”，支持发展中国家推进能源转型、应对气候变化，并要求各国对化石燃料企业的暴利征税。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143175", "publishedAt": "2026-11-11T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "ebdee5cf1ebd794c", "title": "COP31聚焦能源转型：各国探索摆脱化石燃料之路", "summary": "第31届联合国气候变化大会（COP31）周二进入第二天，能源转型成为讨论焦点。巴西提出摆脱化石燃料的路线图，土耳其推动全球电气化倡议，而电网不足和融资成本高企，仍是各国发展清洁能源面临的重要障碍。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143172", "publishedAt": "2026-11-10T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "6eca5c3e6c4ddbe5", "title": "全球15亿妇女和女童生活在气候高风险地区", "summary": "联合国妇女署周二指出，全球超过三分之一的妇女和女童、至少15亿人生活在气候高风险地区。气候灾害、就业不稳定和严重的性别不平等相互叠加，使她们面临更大的生计和安全压力。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143171", "publishedAt": "2026-11-10T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "f4eb7362d024c94c", "title": "古特雷斯：必须加快摆脱化石燃料转型并加强国际合作", "summary": "联合国秘书长古特雷斯周二在土耳其安塔利亚举行的第30届联合国气候变化大会上发表讲话，强调加快摆脱化石燃料的转型，对于将全球气温升幅控制在1.5摄氏度以内，以及建设更清洁、更安全和更具韧性的经济体至关重要。他呼吁各国制定具体转型路线图，加强国际合作，将摆脱化石燃料的承诺转化为实际行动。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143168", "publishedAt": "2026-11-10T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "22a2d3580159e0df", "title": "COP31在安塔利亚开幕：气候承诺能否转化为实际行动？", "summary": "近200个国家的代表周一齐聚土耳其海滨城市安塔利亚，出席第31届联合国气候变化大会（COP31）。本届大会着重推动落实既有承诺，力求在减排、气候融资、清洁能源和保护脆弱社区等议题上取得进展。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143166", "publishedAt": "2026-11-09T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "c6839b01503f7076", "title": "强厄尔尼诺或致全球经济损失11万亿美元", "summary": "国际农业发展基金与土耳其农业和林业部周一联合发布报告警告，强厄尔尼诺事件可能在未来五至六年内给全球经济造成高达11万亿美元的损失，并对粮食安全产生重大而持久的影响。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143165", "publishedAt": "2026-11-09T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "b64ed998830978e2", "title": "贸发会议：贸易合作有助于增强气候行动和经济韧性", "summary": "联合国贸易和发展会议发布的《全球贸易动态》报告指出，随着气候变化带来的经济风险不断上升，贸易合作对于加快气候行动、促进气候技术获取以及增强经济韧性至关重要。报告强调，各国需要加强落实气候承诺，深化贸易合作，帮助发展中经济体参与气候相关价值链。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143164", "publishedAt": "2026-11-09T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "ebc64ad19c6cee3c", "title": "2026年前9个月全球平均地表温度比工业化前水平高出约1.47摄氏度", "summary": "世界气象组织周一发布的《2026年气候状况最新通报》显示，全球气温异常偏高、冰川融化和海平面上升的长期趋势仍在持续。与此同时，一次极强的厄尔尼诺事件预计将进一步加剧高温和极端天气，其影响将持续至2027年。报告强调，这些变化正在对环境、经济和日常生活产生连锁影响。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143162", "publishedAt": "2026-11-09T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "977d7d53790c8a51", "title": "来自北极冰海深处的呼声：世界应当相信科学", "summary": "在漫长的极夜中，一支科考队正随海冰缓缓漂流，记录北极正在发生的深刻变化。海冰逐渐消融，油轮驶入北极航道。这片遥远的冰海正经历着海冰消融与航运活动增加的双重变化，而其影响远不止于北极。在一场跨越千里的视频对话中，北极科考队与联合国秘书长共同探讨了这些变化背后的全球气候挑战，以及为什么在气候危机日益严峻的今天，相信科学尤为重要。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143151", "publishedAt": "2026-11-06T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "d7f4247a42ca857a", "title": "难民署：近9000万被迫流离失所者面临严重气候风险", "summary": "联合国难民署周五发布报告指出，全球近9000万被迫流离失所者生活在气候灾害风险严重的国家，占全球被迫流离失所人口的约四分之三。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143150", "publishedAt": "2026-11-06T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "7e75623cfad793d1", "title": "COP31前瞻：今年联合国气候变化大会有哪些重要议题？", "summary": "如今，全球拥有比以往更多的技术和手段来应对气候变化，但仍有数百万人无法从中受益。随着清洁能源技术以前所未有的速度发展，各国在第31届联合国气候变化大会上面临的挑战，已不再只是寻找解决方案，而是如何让所有人都有能力负担这些方案的成本。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143132", "publishedAt": "2026-11-04T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "bcc3a86d5aca533f", "title": "全球升温恐将突破1.5℃温控红线", "summary": "联合国环境规划署周三发布的《2026年适应差距报告》指出，随着全球升温预计将突破1.5℃目标，发展中国家应对气候变化的资金仍严重不足，适应行动进展缓慢，气候相关损失与损害持续增加。报告估计，到2035年，发展中国家每年需要约3050亿美元适应资金，即使实现国际公共适应资金增加至三倍的目标，也只能满足约两至三成的需求。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143130", "publishedAt": "2026-11-04T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "0876d205502a8ff3", "title": "气温上升，滑雪场及冬季旅游业面临经营压力", "summary": "世界气象组织与国际滑雪和单板滑雪联合会周二联合发布报告指出，随着全球气温上升、降雪条件日益不稳定，滑雪场及冬季旅游业面临越来越大的经营压力。研究显示，如果全球平均气温较工业化前水平升高2℃，在不进行人工造雪的情况下，欧洲28个国家约53%的受调查滑雪场将面临极高的积雪不足风险，部分滑雪场可能因此难以维持经营。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143120", "publishedAt": "2026-11-03T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "e6b776090b25b8d4", "title": "生物多样性公约缔约国制定“埃里温路线图”以加快保护自然行动", "summary": "在距离国际生物多样性保护目标2030年期限过半之际，齐聚亚美尼亚参加联合国生物多样性大会的各国已就一份旨在加快保护自然行动的路线图达成一致。此前一项全球评估显示，世界正偏离实现生物多样性目标的轨道。", "url": "https://news.un.org/feed/view/zh/story/2026/11/1143113", "publishedAt": "2026-11-01T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "f55f45db452c8504", "title": "全球生态系统恢复取得进展，实现2030年目标仍需加快行动", "summary": "联合国周四发布的一份报告显示，全球149个国家正在开展生态系统恢复工作，涉及2.52亿公顷，创造了超过100万个绿色就业岗位。这是有记录以来规模最大的全球生态系统恢复行动。 不过，要兑现2030年承诺，各方仍需迅速扩大行动，尤其要加强淡水、海洋和沿海生态系统的恢复，并将每年的恢复资金投入提高至目前的四倍以上。据估计，到2030年，这些投资有望在全球创造多达3200万个新增就业岗位。", "url": "https://news.un.org/feed/view/zh/story/2026/10/1143092", "publishedAt": "2026-10-29T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "a00e9c4ef0b08e19", "title": "2023年全球高温相关死亡人数达71万，创历史新高", "summary": "世界卫生组织参与发布的一份最新报告周三警告，各国在应对气候变化方面采取的措施仍远远不够，气候变化正持续威胁全球民众的健康与生命。2023年，全球高温相关死亡人数估计达71万，其中超过七成的死亡可归因于人为造成的气候变化。", "url": "https://news.un.org/feed/view/zh/story/2026/10/1143085", "publishedAt": "2026-10-28T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "0c222503a158462c", "title": "联合国警告：随着气候变化加剧，海洋吸收碳的能力正在减弱", "summary": "在第31届联合国气候变化大会即将开幕之际，联合国周三发布最新报告指出，海洋吸收了约30%由人类活动引发的二氧化碳排放以及90%由温室气体捕获的多余热量。然而，气候变化已使海洋吸收碳的能力下降约6%。", "url": "https://news.un.org/feed/view/zh/story/2026/10/1143084", "publishedAt": "2026-10-28T12:00:00Z", "source": "联合国新闻", "lang": "zh"}, {"id": "bf13aa203d9cb19a", "title": "世界气象组织：创纪录的二氧化碳浓度将对人类产生的影响将长达数世纪", "summary": "世界气象组织周二表示，2025年，因燃烧化石燃料导致的大气中二氧化碳及其他主要温室气体的浓度达到创纪录高位，这将导致全球变暖趋势进一步固化。", "url": "https://news.un.org/feed/view/zh/story/2026/10/1143076", "publishedAt": "2026-10-27T12:00:00Z", "source": "联合国新闻", "lang"       text:pickText(item.text),url:item.url||null,date:item.date||null}));
  }

  /* ---------------- opponent ---------------- */
  function cityIssue(){
    const s=state(),G=engine();
    if(!s||!G)return ['',''];
    const city=window.EQContent.cities[G.city(s)];
    return city?city.issue:['',''];
  }
  function eventCandidates(){
    const s=state(),G=engine();
    if(!s||!G)return [];
    const p=G.player(s),ev=G.event(s);
    if(!ev)return [];
    return ev.choices.map((ch,i)=>{
      const effect=G.eventEffect(s,ch);
      const affordable=p.money+ch.money>=0;
      return {id:'event-'+i,index:i,kind:'event',label:pickText(ch.name),effect,
        note:pickText(ch.why),affordable,
        constraint:affordable?tr('本回合只能选一个方案，立即结算。','Only one option may be taken this turn; it settles immediately.')
          :tr('预算不足，无法选择。','Not affordable with the current budget.')};
    });
  }
  function actionCandidates(){
    const s=state(),G=engine();
    if(!s||!G)return {options:[],refs:{}};
    const p=G.player(s),options=[],refs={};
    p.hand.forEach(id=>{
      const c=G.byId(id);
      if(p.money+c.money<0)return;
      options.push({id:'card-'+id,kind:'card',label:pickText(c.name),effect:{money:c.money,energy:c.energy,eco:c.eco},
        note:pickText(c.body),
        constraint:tr('占用本回合唯一一次行动，并补充一张新牌。','Uses this turn’s single action and draws one new card.')});
    });
    G.facilities(s).filter(f=>!G.built(s,f.id)&&p.money>=f.cost).forEach(f=>{
      options.push({id:'facility-'+f.id,kind:'facility',label:pickText(f.name),
        effect:{money:-f.cost,energy:f.energy,eco:f.eco},note:pickText(cityIssue()),
        constraint:tr('占用本回合行动，之后每回合获得收入 ','Uses this turn’s action; income +')+f.income+tr('。','')});
    });
    if(!p.abilityUsed){
      const ability=window.EQContent.roles[p.role].ability;
      if(p.money+(ability.money||0)>=0){
        options.push({id:'ability',kind:'ability',label:pickText(ability.name),
          effect:{money:ability.money||0,energy:ability.energy||0,eco:ability.eco||0},
          note:pickText(ability.body),
          constraint:tr('占用本回合行动，本局只能使用一次。','Uses this turn’s action; available once per game.')});
      }
    }
    options.push({id:'save',kind:'save',label:tr('保留预算，结束回合','Save budget and end the turn'),
      effect:{money:0,energy:0,eco:0},note:tr('储蓄不扣分，也不加分。','Saving is neither rewarded nor punished.'),
      constraint:tr('不消耗资源，也不推进目标。','Costs nothing and advances nothing.')});
    const ctx=Object.assign({},s,{canSign:true,finished:false,lang:nowLang()});
    if(window.EQDelegate){
      s.players.forEach((peer,index)=>{
        if(!peer.ai||index===s.active)return;
        Object.keys(window.EQDelegate.projects).forEach(project=>{
          let offer=null;
          try{offer=window.EQDelegate.offer(ctx,{partner:index,project,share:50});}catch{}
          if(!offer||!offer.accepted)return;
          if(p.money<offer.ownCost)return;
          const id='treaty-'+index+'-'+project;
          refs[id]={offer};
          options.push({id,kind:'treaty',label:pickText(offer.title),
            effect:{money:-offer.ownCost,energy:offer.ownEnergy,eco:offer.ownEco},
            note:tr('我方出资 ','Our cost ')+offer.ownCost+' · '+tr('对方出资 ','partner ')+offer.partnerCost,
            constraint:tr('需要对方代表同意；双方同步落地项目。','Needs the other delegation to agree; both sides receive the project.')});
        });
      });
    }
    return {options,refs};
  }
  function opponentPayload(){
    const s=state(),G=engine();
    if(!s||!G)return null;
    const p=G.player(s),g=G.goals(s,p),ev=G.event(s);
    if(!ev)return null;
    const affordableEvents=eventCandidates().filter(o=>o.affordable);
    if(!affordableEvents.length)return null;
    const {options:actionOptions}=actionCandidates();
    const history=(s.ai&&s.ai.log||[]).filter(item=>item.actor==='ai'&&item.role===p.role).slice(-3)
      .map(item=>({round:item.round,kind:item.kind,label:item.label}));
    const diff=difficulty();
    const body={
      lang:nowLang(),region:'europe',
      difficulty:diff,difficultyFocus:DIFFICULTIES[diff].focus,
      role:p.role,roleName:pickText(window.EQContent.roles[p.role].name),
      mission:pickText(window.EQContent.roles[p.role].mission),
      goals:{energy:g.energy,eco:g.eco,current:{energy:p.energy,eco:p.eco}},
      resources:{budget:p.money,energy:p.energy,ecology:p.eco,resilience:p.resilience||0,contribution:p.contrib||0},
      shared:{ecology:G.score(s),target:G.target(s),pressure:s.pressure,
        delegationsReady:s.players.filter(x=>G.ready(s,x)).length,delegationsNeeded:Math.ceil(s.players.length/2)},
      phase:'event',roundsLeft:s.limit-s.round,
      hand:p.hand.map(id=>({id,label:pickText(G.byId(id).name)})),
      event:{id:ev.id,title:pickText(ev.title),body:pickText(ev.body),source:ev.source,options:affordableEvents},
      action:{options:actionOptions.map(o=>({id:o.id,kind:o.kind,label:o.label,
        effect:o.effect,note:o.note,constraint:o.constraint}))},
      history,
      knowledge:knowledgeFor('europe',['goals','budget','cooperation','energy','ecology'],
        ev.title[0]+' '+ev.body[0],[ev.source].filter(Boolean))
    };
    return {body};
  }
  function rulesEventIndex(payload){
    const s=state(),G=engine();
    const choices=G.event(s).choices.map((ch,i)=>({i,effect:G.eventEffect(s,ch)}))
      .filter(o=>G.player(s).money+o.effect.money>=0);
    if(!choices.length)return 0;
    const best=choices.slice().sort((a,b)=>G.utility(s,b.effect)-G.utility(s,a.effect))[0];
    return best?best.i:0;
  }
  function rulesAction(options){
    const s=state(),G=engine();
    const diff=difficulty();
    const candidates=options.filter(o=>o.kind!=='treaty'&&o.id!=='save');
    let best=null,bestValue=-Infinity;
    candidates.forEach(o=>{
      let value=G.utility(s,o.effect);
      if(diff==='challenge')value+=0.35*o.effect.money*0+0.3*(o.effect.money<0?1:0);
      if(diff==='newbie')value-=0.25*(o.effect.money<0?1:0);
      if(value>bestValue){bestValue=value;best=o;}
    });
    const treaties=options.filter(o=>o.kind==='treaty');
    let treaty=null,treatyValue=-Infinity;
    treaties.forEach(o=>{
      const partnerWeight=diff==='newbie'?0.95:(diff==='challenge'?0.25:0.55);
      const value=G.utility(s,o.effect)+partnerWeight*G.utility(s,{money:-o.effect.money,energy:0,eco:0});
      if(value>treatyValue){treatyValue=value;treaty=o;}
    });
    if(treaty&&(!best||treatyValue>bestValue))return treaty;
    if(best&&bestValue>0)return best;
    return null;
  }
  function applyAction(id,candidates,refs){
    const s=state(),G=engine();
    if(!s||!G)return false;
    const chosen=candidates.options.find(o=>o.id===id);
    if(!chosen)return false;
    if(chosen.kind==='card')return G.playCard(s,chosen.id.replace(/^card-/,''));
    if(chosen.kind==='facility')return G.build(s,chosen.id.replace(/^facility-/,''));
    if(chosen.kind==='ability')return G.useAbility(s);
    if(chosen.kind==='treaty'){
      const ref=refs&&refs[chosen.id];
      return ref&&ref.offer?G.sign(s,ref.offer):false;
    }
    return false;
  }
  async function playOpponentTurn(){
    const s=state(),G=engine();
    if(!s||!G)return;
    const ai=ensure(s);
    const gameId=ai.gameId;
    const role=G.player(s).role;
    if(s.phase!=='roll')return;
    G.roll(s);
    const payload=opponentPayload();
    if(!payload){
      ai.opponent={mode:'rules',reason:tr('本回合没有可负担的方案，按规则推进。','No affordable option was available this turn; the rules advanced the turn.')};
      return;
    }
    const requestKey='opp-'+gameId+'-'+s.round+'-'+s.active+'-'+(ai.turn||0);
    ai.opponent={mode:'thinking',reason:tr('正在请求模型决策…','Asking the model for a decision…')};
    if(window.EQApp&&window.EQApp.render)window.EQApp.render();
    let modelResult=null;
    try{
      const response=await uniqueRequest(requestKey,payload.body,'/api/ai/opponent');
      if(response&&response.ok&&response.result){modelResult=response.result;noteSuccess();}
    }catch{modelResult=null}
    const current=state();
    if(!current||!current.ai||current.ai.gameId!==gameId)return;
    if(current!==s||s.phase!=='event')return;
    let eventIndex=rulesEventIndex(payload);
    if(modelResult&&modelResult.eventChoiceId){
      const match=payload.body.event.options.find(o=>o.id===modelResult.eventChoiceId);
      if(match)eventIndex=match.index;
    }
    let decided=G.choose(s,eventIndex);
    if(!decided){
      const ev=G.event(s);
      for(let i=0;ev&&i<ev.choices.length&&!decided;i++)decided=G.choose(s,i);
      if(!decided&&s.phase==='event')s.phase='feedback';
    }
    G.toAction(s);
    const after=actionCandidates();
    let applied=false;
    const chosenId=modelResult?String(modelResult.actionChoiceId||''):'';
    if(chosenId&&after.options.some(o=>o.id===chosenId))applied=applyAction(chosenId,after,after.refs);
    if(!applied&&chosenId==='save')applied=true;
    if(!applied&&chosenId){
      const fallback=rulesAction(after.options);
      if(fallback)applied=applyAction(fallback.id,after,after.refs);
    }
    if(!applied){
      const fallback=rulesAction(after.options);
      if(fallback)applied=applyAction(fallback.id,after,after.refs);
    }
    const last=s.log[s.log.length-1]||{};
    const reason=modelResult&&modelResult.reason
      ?String(modelResult.reason).slice(0,400)
      :tr('本回合按离线规则策略执行。','This turn was executed by the offline rule policy.');
    const entry=ensure(current);
    entry.log.push({key:requestKey,round:s.round,role,actor:'ai',kind:'ai',label:reason,
      effect:{money:last.money||0,energy:last.energy||0,eco:last.eco||0},
      mode:modelResult?'model':'rules'});
    entry.opponent={mode:modelResult?'model':'rules',reason:modelResult?reason:''};
    entry.turn=(entry.turn||0)+1;
    const previousRound=s.round;
    G.settle(s);
    if(s.round!==previousRound)adaptiveAtRoundEnd(previousRound);
  }

  /* ---------------- coach ---------------- */
  function decisionKey(kind,targetId){
    const s=state(),G=engine();
    if(!s||!G)return kind+'|'+targetId;
    return [s.round,G.player(s).role,kind,targetId].join('|');
  }
  function recordDecision(entry){
    const s=state(),G=engine();
    if(!s||!G)return null;
    const ai=ensure(s);
    const key=entry.key||decisionKey(entry.kind,entry.targetId);
    if(!ai.log.some(item=>item.key===key)){
      const chosen=(entry.options||[]).find(o=>o.id===entry.chosenId);
      ai.log.push(Object.assign({round:s.round,role:G.player(s).role,actor:'human',
        label:entry.label||(chosen?chosen.label:entry.chosenId||entry.kind),
        chosenId:entry.chosenId||null},entry,{key}));
      if(window.EQApp&&window.EQApp.save)window.EQApp.save();
    }
    return key;
  }
  function coachPayload(entry,key){
    const s=state(),G=engine();
    const p=G.player(s);
    const before=entry.before||snapshot();
    const after=entry.after||before;
    const options=(entry.options||[]).map(o=>({id:o.id,label:o.label,effect:o.effect,
      note:o.note||'',constraint:o.constraint||''}));
    const chosen=(entry.options||[]).find(o=>o.id===entry.chosenId)||null;
    const history=((s.ai&&s.ai.log)||[]).filter(item=>item.actor==='human'&&item.role===p.role).slice(-4)
      .map(item=>({round:item.round,kind:item.kind,label:item.label}));
    return {
      lang:nowLang(),region:'europe',kind:entry.kind,decisionKey:key,
      situation:{round:s.round,city:pickText(window.EQContent.cities[G.city(s)].name),phase:entry.phase||'decision'},
      goal:{targets:{energy:before.goals.energy,eco:before.goals.eco},
        current:{energy:before.energy,eco:before.ecology},budget:before.budget},
      sharedGoal:before.shared,
      options,chosen:chosen?{id:chosen.id,label:chosen.label,effect:chosen.effect}:null,
      outcome:{money:after.budget-before.budget,energy:after.energy-before.energy,eco:after.ecology-before.ecology},
      resourcesBefore:before,resourcesAfter:after,
      playerReason:String(entry.playerReason||'').slice(0,240),
      history,
      knowledge:knowledgeFor('europe',entry.topics||['goals','budget','cooperation'],
        (entry.text||'')+' '+(chosen?chosen.label:''),entry.sources||[])
    };
  }
  async function requestCoach(entry){
    const s=state();
    if(!s)return null;
    const ai=ensure(s);
    const gameId=ai.gameId;
    const key=recordDecision(entry);
    if(!key)return null;
    const existing=ai.coach[key];
    if(existing&&existing.result&&!entry.playerReason)return {ok:true,key,stored:existing,reused:true};
    if(ai.pendingCoach[key])return {ok:false,code:'pending',key};
    ai.pendingCoach[key]=true;
    const payload=coachPayload(entry,key);
    const requestKey='coach-'+gameId+'-'+key+(entry.playerReason?'-r'+Date.now():'');
    const response=await uniqueRequest(requestKey,payload,'/api/ai/coach');
    const current=state();
    if(!current||!current.ai||current.ai.gameId!==gameId)return null;
    delete current.ai.pendingCoach[key];
    if(!response||!response.ok)return {ok:false,code:(response&&response.code)||'unavailable',key};
    noteSuccess();
    const stored=existing||{key,rubric:RUBRIC,revisions:[]};
    stored.revisions=stored.revisions||[];
    stored.revisions.push({result:response.result,model:response.result.model||null,
      at:new Date().toISOString(),playerReason:entry.playerReason||'',rubric:RUBRIC});
    stored.result=response.result;
    stored.model=response.result.model||null;
    stored.rubric=RUBRIC;
    stored.revision=stored.revisions.length;
    stored.at=stored.revisions[stored.revisions.length-1].at;
    ai.coach[key]=stored;
    if(window.EQApp&&window.EQApp.save)window.EQApp.save();
    return {ok:true,key,stored};
  }

  function scoreSummary(scores){
    const dims=[];
    let sum=0,count=0;
    DIMENSIONS.forEach(dim=>{
      const item=(scores&&scores[dim.id])||{};
      const level=typeof item.level==='number'?item.level:null;
      dims.push({id:dim.id,label:dim.label,level,why:item.why||'',levels:dim.levels});
      if(level!==null){sum+=level;count++;}
    });
    return {dimensions:dims,total:count?Math.round(sum/(5*count)*100):null,applicable:count};
  }

  async function requestReview(force){
    const s=state();
    if(!s)return null;
    const ai=ensure(s);
    const gameId=ai.gameId;
    if(ai.review&&ai.review.result&&!force)return {ok:true,stored:ai.review,reused:true};
    if(ai.reviewPending)return {ok:false,code:'pending'};
    ai.reviewPending=true;
    ai.reviewError='';
    const payload=reviewPayload();
    const requestKey='review-'+gameId+(force?'-'+Date.now():'-once');
    const response=await uniqueRequest(requestKey,payload,'/api/ai/review');
    const current=state();
    if(!current||!current.ai||current.ai.gameId!==gameId)return null;
    current.ai.reviewPending=false;
    if(!response||!response.ok){
      current.ai.reviewError=REVIEW_ERRORS[response&&response.code]||tr('复盘生成失败，请重试。','The review could not be generated. Please retry.');
      return {ok:false,code:(response&&response.code)||'unavailable'};
    }
    noteSuccess();
    const previous=ai.review&&ai.review.result?ai.review:null;
    ai.review={result:response.result,model:response.result.model||null,rubric:RUBRIC,
      at:new Date().toISOString(),previous:previous||null};
    if(window.EQApp&&window.EQApp.save)window.EQApp.save();

  async function autoReview(){
    const s=state();
    if(!s)return;
    const ai=ensure(s);
    if(ai.review&&ai.review.result)return;
    if(ai.reviewPending)return;
    const outcome=await requestReview(false);
    if(outcome&&outcome.ok&&window.EQApp)window.EQApp.rerenderResults();
  }

  /* ---------------- adaptive ---------------- */
  function adaptiveAtRoundEnd(round){
    const s=state(),G=engine();
    if(!s||!G)return null;
    const ai=ensure(s);
    if(!ai.adaptive||ai.manual)return null;
    if(ai.lastAdaptiveRound===round)return null;
    ai.lastAdaptiveRound=round;
    const human=s.players.find(p=>!p.ai);
    if(!human)return null;
    const mine=((s.ai&&s.ai.log)||[]).filter(item=>item.actor==='human'&&item.role===human.role&&item.round<=round);
    if(mine.length<2)return null;
    const recent=mine.slice(-6);
    let contribution=0,count=0;
    recent.forEach(item=>{
      if(item.after&&typeof item.after.ecology==='number'){
        contribution+=(item.after.ecology-(item.before?item.before.ecology:item.after.ecology));
        count++;
      }
    });
    const avgContribution=count?contribution/count:0;
    const g=G.goals(s,human);
    const goalProgress=(Math.min(human.energy,g.energy)/g.energy+Math.min(human.eco,g.eco)/g.eco)/2;
    const budgetHealth=Math.min(1,human.money/60);
    const signal=avgContribution*1.2+goalProgress*2+budgetHealth-1.6;
    let next=signal<0.55?'newbie':(signal>1.5?'challenge':'standard');
    if(next===difficulty()){
      ai.adaptiveNote=tr('难度保持不变：','Difficulty unchanged: ')+
        tr('最近几个回合的资源运用、目标进展与操作表现都在中间区间。','Recent turns show mid-range resource use, goal progress and action quality.');
      return null;
    }
    const reason=signal<0.55
      ? tr('最近几个回合投入偏低、目标推进较慢，已放宽策略压力。','Recent turns show limited investment and slow goal progress, so strategy pressure was eased.')
      : tr('最近几个回合资源运用与目标推进都较稳，已提高策略压力。','Recent turns show solid resource use and goal progress, so strategy pressure was raised.');
    ai.difficulty=next;
    ai.adaptiveNote=reason+' · '+tr('当前难度','now')+'：'+DIFFICULTIES[next].label[0];
    return {difficulty:next,reason:ai.adaptiveNote};
  }

      '<span class="mini">'+esc(tr('辅助评价 · 不改变游戏规则','Teaching note · does not change the rules'))+'</span></div>'+
      '<p class="ai-coach-headline">'+esc(result.headline||'')+'</p>'+
      (compact?'':'<div class="ai-coach-actions"><input class="ai-reason-input" type="text" maxlength="120" placeholder="'+
      esc(tr('可选：补一句你的理由','Optional: add your reason'))+'" data-ai-reason-for="'+esc(key)+'">'+
      '<button class="mini-btn" data-ai-reason-submit="'+esc(key)+'">'+esc(tr('结合理由重评','Re-evaluate with reason'))+'</button></div>')+
      '<details class="ai-coach-detail"><summary>'+esc(tr('展开详细解释与评分','Show the reasoning and the learning score'))+'</summary>'+
      '<p><b>'+esc(tr('与目标是否匹配','Fit with your goals'))+'：</b>'+esc(result.match||'')+'</p>'+
      '<p><b>'+esc(tr('得到了什么','What you gained'))+'：</b>'+esc(result.gained||'')+'</p>'+
      '<p><b>'+esc(tr('牺牲了什么','What you gave up'))+'：</b>'+esc(result.sacrificed||'')+'</p>'+
      '<p><b>'+esc(tr('可考虑的替代方案','Worth considering instead'))+'：</b>'+esc((result.alternative&&result.alternative.label)||'')+
      ((result.alternative&&result.alternative.condition)?' — '+esc(result.alternative.condition):'')+'</p>'+
      '<p><b>'+esc(tr('下一回合关注','Focus for next round'))+'：</b>'+esc(result.nextFocus||'')+'</p>'+
      scoreHead(summary)+
      (cited.length?'<div class="ai-policy"><span class="mini">'+esc(tr('查看政策依据','Policy basis'))+'</span>'+cited.join('')+'</div>':'')+
      (stale?'<p class="ai-stale-note">'+esc(tr('该反馈由较早的评分标准生成，已按原样保留。','This note was written under an earlier rubric and is kept unchanged.'))+'</p>':'')+
      (stored.revision>1?'<p class="ai-stale-note">'+esc(tr('该决定已评估 '+stored.revision+' 次，历史版本均已保留。','This decision was assessed '+stored.revision+' times; earlier versions are kept.'))+'</p>':'')+
      '</details></div>';
  }
  function aiPanel(){
    const s=state();
    if(!s)return '';
    const ai=ensure(s);
    const diff=difficulty();
    const rows=Object.keys(DIFFICULTIES).map(id=>'<button class="selectable '+(diff===id?'on':'')+
      '" data-ai-difficulty="'+id+'" aria-pressed="'+(diff===id)+'">'+esc(DIFFICULTIES[id].label[0])+'</button>').join('');
    const mode=ai.opponent.mode;
    const modeLabel=mode==='model'?tr('本回合由模型决策','This turn was decided by the model')
      :(mode==='rules'?tr('规则对手 / 离线模式','Rules opponent / offline mode')
      :mode==='thinking'?tr('模型正在选择…','The model is choosing…')
      :tr('等待第一次对手决策','Waiting for the first opponent decision'));
    const lastAi=[...(ai.log||[])].reverse().find(item=>item.actor==='ai');
    const link=model.enabled
      ? '<span class="ai-status-dot ok" title="'+esc(tr('模型服务已连接','Model service connected'))+'"></span>'+
        '<span class="mini">'+esc(tr('模型已连接','Model connected'))+' · '+esc(model.name||'')+'</span>'
      : '<span class="ai-status-dot warn" title="'+esc(tr('模型服务不可用，将使用规则对手','Model service unavailable; rules opponent will be used'))+'"></span>'+
        '<span class="mini">'+esc(tr('模型未连接 · 规则对手','Model unavailable · rules opponent'))+'</span>'+
        (model.note?'<span class="ai-status-note">'+esc(model.note)+'</span>':'');
    return '<section class="pane ai-panel"><div class="panel-head"><h2>'+esc(tr('AI 对手','AI opponent'))+'</h2>'+opponentBadge()+'</div>'+
      '<p class="sub">'+esc(modeLabel)+'</p>'+
      '<div class="ai-status">'+link+'</div>'+
      '<div class="tools-line">'+rows+'</div>'+
      '<p class="sub">'+esc(DIFFICULTIES[diff].hint[0])+'</p>'+
      '<div class="ai-switch"><label><input type="checkbox" data-ai-adaptive '+(ai.adaptive?'checked':'')+'> '+
      esc(tr('自适应难度','Adaptive difficulty'))+'</label><span class="mini">'+
      esc(ai.adaptive?tr('已开启','On'):tr('已关闭','Off'))+'</span></div>'+
      (ai.adaptiveNote?'<p class="ai-adaptive-note">'+esc(ai.adaptiveNote)+'</p>':'')+
      (lastAi?'<p class="ai-last"><b>'+esc(tr('最近一次对手说明','Latest opponent note'))+'：</b>'+esc(lastAi.label||'')+'</p>':'')+
      '<p class="ai-mode-note">'+esc(tr('AI 只控制电脑代表，使用与玩家相同的规则、预算与信息，不会读取别人的手牌。','The AI only controls computer delegations, with the same rules, budget and information; it never reads other hands.'))+'</p>'+
      coachBlock()+'</section>';
  }
  function reviewBlock(){
    const s=state();
    if(!s)return '';
    const ai=ensure(s);
    if(!ai.review||!ai.review.result){
      return '<section class="ai-review-block"><div class="ai-review-head"><span class="mini">'+esc(tr('AI 复盘','AI review'))+'</span></div>'+
        '<p class="sub">'+esc(tr('复盘基于本局决策日志生成，不会补写你没有做过的行为。','The review is built from this game’s decision log and never invents actions you did not take.'))+'</p>'+
        '<button class="secondary" data-ai-review="1">'+esc(tr('生成 AI 复盘','Generate the AI review'))+'</button>'+
        (ai.reviewPending?'<p class="ai-review-loading">'+esc(tr('正在生成…','Generating…'))+'</p>':'')+
        (ai.reviewError?'<p class="ai-stale-note">'+esc(ai.reviewError)+'</p>':'')+'</section>';
    }    const r=ai.review.result;
    const summary=scoreSummary(r.learning);
    const cited=(r.citedIds||[]).map(policyLink).filter(Boolean);
    return '<section class="ai-review-block"><div class="ai-review-head"><span class="mini">'+esc(tr('AI 复盘','AI review'))+'</span>'+
      '<button class="mini-btn" data-ai-review-retry="1">'+esc(tr('重新生成','Regenerate'))+'</button></div>'+
      '<p class="ai-review-summary">'+esc(r.summary||'')+'</p>'+
      scoreHead(summary,tr('以上为教学建议；原有游戏成绩由规则计算，两者分开显示。','The above is teaching guidance; the game result is calculated by the rules and shown separately.'))+
      '<h4>'+esc(tr('关键决策','Key decisions'))+'</h4><ol class="ai-key-list">'+
      (r.keyDecisions||[]).map(d=>'<li><b>'+esc(d.situation)+'</b><br>'+esc(tr('你的选择：','Your choice: ')+d.choice)+
      '<br>'+esc(tr('主要权衡：','Main trade-off: ')+d.tradeoff)+'<br>'+esc(tr('可考虑的替代：','Alternative: ')+d.alternative)+'</li>').join('')+'</ol>'+
      '<p><b>'+esc(tr('值得保留的做法','Worth keeping'))+'：</b>'+esc(r.keep||'')+'</p>'+
      '<p><b>'+esc(tr('下次最值得改进','Improve next time'))+'：</b>'+esc(r.improve||'')+'</p>'+
      '<div class="ai-campus"><span class="mini">'+esc(tr('校园行动建议','Campus action'))+'</span><p><b>'+esc((r.campus&&r.campus.action)||'')+'</b></p>'+
      '<p>'+esc(tr('目标：','Goal: ')+((r.campus&&r.campus.goal)||''))+'</p>'+
      '<p>'+esc(tr('第一步：','First step: ')+((r.campus&&r.campus.firstStep)||''))+'</p>'+
      '<p>'+esc(tr('需要谁参与：','Who is needed: ')+((r.campus&&r.campus.who)||''))+'</p>'+
      '<p>'+esc(tr('如何观察效果：','How to observe: ')+((r.campus&&r.campus.observe)||''))+'</p>'+
      '<p>'+esc(tr('还需核实：','Still to verify: ')+((r.campus&&r.campus.verify)||''))+'</p></div>'+
      (cited.length?'<div class="ai-policy"><span class="mini">'+esc(tr('查看政策依据','Policy basis'))+'</span>'+cited.join('')+'</div>':'')+
      '<p class="ai-score-note">'+esc(tr('游戏内的预算与生态点数是教学数值，不等于现实成本或减排量。','Budget and ecology points in the game are teaching values, not real costs or abatement figures.'))+'</p></section>';
  }
  function reviewText(){
    const s=state();
    if(!s)return '';
    const ai=ensure(s);
    if(!ai.review||!ai.review.result)return '';
    const r=ai.review.result,summary=scoreSummary(r.learning);
    const lines=[tr('AI 学习评价（教学参考，不参与胜负判定）','AI learning score (teaching reference, does not decide the winner)')];
    summary.dimensions.forEach(dim=>lines.push('- '+pickText(dim.label)+'：'+
      (dim.level===null?tr('无法评价／不适用','Not applicable'):dim.level+'/5')+(dim.why?' — '+dim.why:'')));
    lines.push(tr('总分（按可评价维度归一）','Total (normalised over applicable dimensions)')+'：'+
      (summary.total===null?'—':summary.total+'/100'));
    lines.push('',r.summary||'');
    (r.keyDecisions||[]).forEach((d,i)=>lines.push((i+1)+'. '+d.situation+' | '+d.choice+' | '+d.tradeoff+' | '+d.alternative));
    lines.push(tr('值得保留：','Keep: ')+(r.keep||''),tr('下次最值得改进：','Improve: ')+(r.improve||''));
    const campus=r.campus||{};
    lines.push(tr('校园行动建议：','Campus action: ')+(campus.action||''));
    lines.push('- '+tr('目标','Goal')+'：'+(campus.goal||''),
      '- '+tr('第一步','First step')+'：'+(campus.firstStep||''),
      '- '+tr('参与者','Who')+'：'+(campus.who||''),
      '- '+tr('观察方式','Observe')+'：'+(campus.observe||''),
      '- '+tr('待核实','Verify')+'：'+(campus.verify||''));
    lines.push('',tr('说明：游戏数值为教学单位，现实效果需以实测为准。','Note: game values are teaching units; real outcomes require measurement.'));
    return lines.join('\n');
  }
  return {
    DIFFICULTIES,DIMENSIONS,RUBRIC,
    ensure,difficulty,setDifficulty,adaptiveEnabled,setAdaptive,status,watchStatus,snapshot,
    playOpponentTurn,requestCoach,requestReview,autoReview,adaptiveAtRoundEnd,recordDecision,decisionKey,
    aiPanel,coachBlock,reviewBlock,reviewText,opponentBadge,scoreSummary,knowledgeFor
  };
})();

    const share = raw.share != null && raw.share !== '' && shares.includes(Number(raw.share)) ? Number(raw.share) : 50;

  function offer(ctx, raw = {}) {
    const draft = normalized(ctx, raw);
    const own = ctx.players[ctx.active];
    const peer = ctx.players[draft.partner];
    const project = projects[draft.project];
    const ownCost = Math.round(project.cost * draft.share / 100);
    const result = { accepted: false, status: 'refuse', partner: draft.partner, ownCost,
      partnerCost: project.cost - ownCost, ownEnergy: project.energy, partnerEnergy: project.energy,
      ownEco: project.eco, partnerEco: project.eco, key: draft.project, title: project.title.slice(),
      ownShare: draft.share, totalCost: project.cost, counterShare: null, signals: [] };
    if (!own || !peer || !delegates[peer.role]) return result;
    const duplicate=ctx.log.some(e=>e.kind==='treaty'&&e.role===own.role&&e.partner===peer.role&&e.project===draft.project);
    const mandate = delegates[peer.role];
    const ownBalance = Math.max(0,Math.floor(number(own.money)));
    const peerBalance = Math.max(0,Math.floor(number(peer.money)));
    const folded = draft.note.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g,'l');
    const matches = draft.aiTopics ? signals.filter(s => draft.aiTopics.includes(s[0])) : signals.filter(s => s[2].test(folded));
    const reserved = mandate.reserve;
    const peerWeight = peerBalance / Math.max(1, ownBalance + peerBalance);
    const fair = Math.round(project.cost * Math.min(0.75, Math.max(0.25, peerWeight)));
    const preference = mandate.focus === draft.project ? 3 : mandate.next === draft.project ? 1 : 0;
    const need = (peer.energy < peer.eco && project.energy > project.eco) ||
      (peer.eco < peer.energy && project.eco > project.energy) ? 2 : 0;
    const goodwill = draft.aiGoodwill != null ? draft.aiGoodwill : Math.min(2, matches.filter(s => mandate.intent.includes(s[0])).length);
    const ceiling = Math.min(Math.max(0, peerBalance - reserved), fair + preference + need + goodwill);
    const feasible = shares.filter(share => {
      const ownAmount = Math.round(project.cost * share / 100);
      return ownAmount <= ownBalance && project.cost - ownAmount <= ceiling;
    });
    const accepted = feasible.includes(draft.share);
    const nearest = feasible.slice().sort((a,b) => Math.abs(a-draft.share)-Math.abs(b-draft.share))[0];
    Object.assign(result, { accepted, status: accepted ? 'accept' : feasible.length ? 'counter' : 'refuse',
      counterShare: accepted ? null : (nearest ?? null), ceiling, fair, preference, need, goodwill, reserved,
      ownBalance, peerBalance, signals: matches.map(s => s[0]) });

    return result;

/* Real news is read from the official UN feed; it never changes game resources. */
window.EQNews=(()=>{
 const KEY='ecoquest.real-news.v2',PREF='ecoquest.news-muted.v2';
 const snapshots=window.EQNewsSnapshot||{};
 let getContext=null,current=null,data={},refreshing=false,lastLanguage=null,started=false,muted=false;
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tr=(zh,en)=>current?.lang==='en'?en:zh;
 const CLIMATE=/气候|COP|升温|气温|高温|热浪|洪|旱|厄尔尼诺|碳|排放|能源|化石燃料|可再生|生态|生物多样性|海洋|冰川|海平面|适应|韧性|预警|灾害|自然|森林|湿地|北极|climate|warming|temperature|heat|flood|drought|el ni|carbon|co2|co₂|emission|energy|fossil|renewable|nature|biodiversity|ocean|glacier|sea level|adapt|resilien|early warning|disaster|ecosystem|restor|arctic|soil/i;
 const OFFTOPIC=/自杀|百草枯|加沙|朝鲜半岛|也门|要闻简报|suicide|paraquat|gaza|korea|yemen|news in brief/i;
 function valid(item){
  const text=String(item&&item.title||'')+' '+String(item&&item.summary||'');if(!CLIMATE.test(text)||OFFTOPIC.test(text))return false;
  try{const u=new URL(item.url),date=Date.parse(item.publishedAt);return u.protocol==='https:'&&u.hostname==='news.un.org'&&!u.username&&!u.password&&typeof item.title==='string'&&item.title.length<=400&&Number.isFinite(date)&&date<Date.now()+86400000&&date>Date.UTC(2020,0,1);}catch{return false}
 }
 function clean(payload){
  if(!payload||!Array.isArray(payload.items))return null;
  const items=payload.items.filter(valid).slice(0,24).map(i=>({id:String(i.id||i.url),title:i.title,summary:String(i.summary||'').slice(0,240),url:i.url,publishedAt:i.publishedAt,source:String(i.source||'UN News'),lang:i.lang==='zh'?'zh':'en'}));
  return items.length?{...payload,items}:null;
 }
 function record(){return data[current?.lang]||snapshots[current?.lang]||snapshots.zh||{items:[],mode:'snapshot'}}
 function date(value,time=false){if(!value||!Number.isFinite(Date.parse(value)))return tr('未知日期','Unknown date');return new Date(value).toLocaleString(current?.lang==='en'?'en-GB':'zh-CN',time?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'2-digit',day:'2-digit'});}
 function status(){const r=record();return refreshing?tr('正在获取新闻…','Updating news…'):r.refreshFailed?tr('本次更新失败，显示已保存报道','Update failed · saved reports'):r.mode==='snapshot'?tr('随附报道快照','Included news snapshot'):tr('已保存的在线报道','Saved online reports');}
 function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch{}}
 function gameState(){const s=current?.state;if(!s)return null;if(!s.news||!Array.isArray(s.news.seen)||!Array.isArray(s.news.rounds))s.news={seen:[],rounds:[],active:null,treaties:0};return s.news;}
 function relevant(items){
  const s=current.state,role=s.players[s.active]?.role;
  const terms={nl:/水|洪|water|flood/i,pt:/水|旱|water|drought/i,es:/热|旱|heat|drought/i,dk:/电|能源|energy|power/i,se:/能源|工业|energy|industry/i,pl:/转型|资金|transition|finance/i,fr:/城市|建筑|cit|building/i,de:/能源|转型|energy|transition/i}[role];
  return items.slice().sort((a,b)=>Number(terms?.test(b.title+' '+b.summary))-Number(terms?.test(a.title+' '+a.summary)))[0];
 }
 function selectedArticle(){
  const n=gameState();if(!n?.active)return null;
  const saved=n.activeArticles?.[current.lang];
  if(valid(saved)&&saved.id===n.active){
   const fresh=record();
   if(saved.captureMode==='snapshot'&&fresh.mode!=='snapshot'&&!fresh.refreshFailed&&fresh.items.some(i=>i.id===saved.id)){
    const updated={...saved,captureMode:fresh.mode,capturedAt:fresh.fetchedAt};n.activeArticles[current.lang]=updated;current.save?.();return updated;
   }
   return saved;
  }
  const r=record();
  const item=valid(saved)?saved:r.items.find(i=>i.id===n.active)||relevant(r.items.filter(i=>!n.seen.includes(i.id)))||r.items[0];
  if(!item)return null;
  const selected={...item,captureMode:item.captureMode||r.mode,capturedAt:item.capturedAt||r.fetchedAt};
  n.active=selected.id;n.activeArticles={...(n.activeArticles||{}),[current.lang]:selected};
  if(!n.seen.includes(selected.id))n.seen.push(selected.id);
  current.save?.();return selected;
 }
 function paint(){
  const region=document.querySelector('#news-region');if(!region||!current)return;
  if(muted||current.busy||current.modal){region.hidden=true;region.innerHTML='';return}
  const item=selectedArticle();
  if(!item){region.hidden=true;region.innerHTML='';return}
  const older=Date.now()-Date.parse(item.publishedAt)>14*86400000;
  region.hidden=false;region.innerHTML='<div class="news-bulletin" role="status" aria-live="polite"><div class="news-label"><span class="news-dot"></span>'+tr('插播新闻','Climate bulletin')+'<small>'+tr('真实报道','Real report')+'</small></div><div class="news-copy"><button class="news-headline" data-news="article" data-news-id="'+escape(item.id)+'">'+escape(item.title)+'</button><p>'+escape(item.source)+' · '+tr('发布于 ','Published ')+date(item.publishedAt)+(older?' · '+tr('较早报道','Earlier report'):'')+' · '+(item.captureMode==='snapshot'?tr('离线快照','Offline snapshot'):tr('已联网获取','Retrieved online'))+'</p></div><button class="text-btn" data-news="open">'+tr('查看快讯','Read news')+'</button><button class="news-dismiss" data-news="dismiss" aria-label="'+tr('收起本条新闻','Dismiss this bulletin')+'">×</button></div>';
 }
 function observe(state,lang,busy,modal){
  current={...(getContext?.()||{}),state,lang,busy,modal};if(!started)return;
  const n=gameState(),safe=!busy&&!modal&&state.phase==='roll';
  const treatyCount=state.log.filter(e=>e.kind==='treaty').length;
  const milestone=state.round===1||state.round%2===0||treatyCount>n.treaties;
  if(!muted&&safe&&milestone&&!n.rounds.includes(state.round)){
   const unseen=record().items.filter(i=>!n.seen.includes(i.id));const item=relevant(unseen);
   if(item){n.active=item.id;n.activeArticles={[lang]:{...item,captureMode:record().mode,capturedAt:record().fetchedAt}};n.seen.push(item.id);n.rounds.push(state.round);n.treaties=treatyCount;current.save?.();}
  }
  paint();
  if(lastLanguage!==lang){lastLanguage=lang;void refresh(false)}
 }
 function sync(){if(getContext){const c=getContext();observe(c.state,c.lang,c.busy,c.modal)}}
 function itemHtml(item){return '<article class="news-article"><div class="news-article-meta">'+escape(item.source)+' · '+tr('报道日期 ','Published ')+date(item.publishedAt)+'</div><h3>'+escape(item.title)+'</h3><p>'+escape(item.summary)+'</p><a href="'+escape(item.url)+'" target="_blank" rel="noopener noreferrer">'+tr('阅读原文','Read original report')+' ↗</a></article>';}
 function open(id){
  if(!current)return;
  const r=record(),selected=selectedArticle();
  let items=id?r.items.filter(i=>i.id===id):r.items.slice(0,12);
  if(id&&!items.length&&selected)items=[selected];
  const online=location.protocol!=='file:';
  current.show(tr('气候快讯','Climate news'),'<div class="news-controls"><span>'+escape(status())+'</span><button class="secondary" data-news="refresh" '+(refreshing||!online?'disabled':'')+'>'+(online?tr('更新新闻','Refresh news'):tr('单文件快照','Offline snapshot'))+'</button><button class="secondary" data-news="mute" aria-pressed="'+muted+'">'+(muted?tr('恢复插播','Enable bulletins'):tr('暂停插播','Pause bulletins'))+'</button></div><p class="sub">'+tr('新闻来自联合国新闻的气候与环境订阅，报道日期与本局轮次无关，不会直接改变游戏数值。','Reports come from the official UN News climate-and-environment feed. Publication dates are independent of game rounds. News does not change game values.')+'</p><p class="news-updated">'+tr('最近成功获取：','Last successful fetch: ')+date(r.fetchedAt,true)+(online?tr(' · 打开期间每15分钟检查更新',' · Checks every 15 minutes while open'):tr(' · 当前为单文件版',' · Standalone file mode'))+'</p>'+(!online?'<div class="next-step-note">'+tr('需要持续更新时，请双击同文件夹的“启动Ecoquest-实时新闻.cmd”。单独打开HTML时显示带日期的报道快照。','For continuous updates, double-click “启动Ecoquest-实时新闻.cmd” in the same folder. Opening the HTML alone shows dated saved reports.')+'</div>':'')+(items.length?items.map(itemHtml).join(''):'<p>'+tr('暂时没有可用报道，稍后可再次更新。','No reports are available. Try updating later.')+'</p>'),'news',id);
 }
 async function refresh(force=false){
  if(!current||refreshing)return false;
  const language=current.lang;
  if(location.protocol==='file:'){syncPaint();return false}
  refreshing=true;paint();
  try{
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
   let payload;try{const response=await fetch('/api/news?lang='+language+(force?'&refresh=1':''),{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('Unavailable');payload=clean(await response.json())}finally{clearTimeout(timer)}
   if(!payload)throw Error('No valid news');data[language]=payload;persist();
  }catch{const old=data[language]||snapshots[language];if(old)data[language]={...old,refreshFailed:true};}
  finally{refreshing=false;syncPaint();if(current?.modal?.kind==='news')open(current.modal.data);if(current?.lang!==language)void refresh(false)}
  return !data[language]?.refreshFailed;
 }
 function syncPaint(){if(getContext){const c=getContext();current={...c};paint()}}
 function boot(context){
  if(started)return;getContext=context;
  try{muted=localStorage.getItem(PREF)==='1';const stored=JSON.parse(localStorage.getItem(KEY)||'{}');for(const lang of ['zh','en'])data[lang]=clean(stored[lang])||clean(snapshots[lang])}catch{data={zh:clean(snapshots.zh),en:clean(snapshots.en)}}
  started=true;sync();
  setInterval(()=>{if(!document.hidden)void refresh(false)},15*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)void refresh(false)});
 }
 document.addEventListener('click',event=>{
  const b=event.target.closest('[data-news]');if(!b||b.disabled||!current)return;
  const action=b.dataset.news;
  if(action==='open')open();
  if(action==='article')open(b.dataset.newsId);
  if(action==='dismiss'){const n=gameState();if(n){n.active=null;n.activeArticles={}}current.save();paint()}
  if(action==='refresh')void refresh(true);
  if(action==='mute'){muted=!muted;try{localStorage.setItem(PREF,muted?'1':'0')}catch{}paint();open(current.modal?.data)}

function mast(){
 const titles={board:[t('欧洲气候远征','European climate expedition'),t('像大富翁一样掷骰前进：用有限预算，和其他国家一起完成能源与生态转型。','Roll like a board game: spend a limited budget with other countries to finish the energy and ecology transition.')],cards:[t('卡牌档案','Card library'),t('查阅事件、政策背景与原语言术语。','Explore events, policy context and native terminology.')],summit:[t('气候议会','Climate council'),t('选择一个合作项目，商议双方出资。','Choose a joint project and agree on contributions.')],lab:[t('气候行动实验室','Climate Action Lab'),t('回顾本局决策，制定校园或社区试点。','Use this game’s decisions to plan a campus or community pilot.')]};

function turnGuide(){
 const index=s.phase==='roll'?0:['event','feedback'].includes(s.phase)?1:s.phase==='action'&&!s.used?2:3;
 const labels=[t('掷骰旅行','Roll'),t('处理事件','Resolve event'),t('选择行动','Take action'),s.phase==='finished'?t('本局结束','Finished'):t('结束回合','End turn')];
 return '<section class="turn-guide" aria-label="'+t('回合步骤','Turn steps')+'"><div class="turn-caption"><span class="route-node"></span><span>'+t('第 '+s.round+' / '+s.limit+' 轮','Round '+s.round+' / '+s.limit)+'</span><b>'+roleName(Game.player(s))+'</b></div><ol class="turn-steps">'+labels.map((label,i)=>'<li class="'+(i<index?'done':'')+'" '+(i===index?'aria-current="step"':'')+'><span>'+(i<index?ico('check'):i+1)+'</span>'+label+'</li>').join('')+'</ol><button class="text-btn" data-act="help">'+t('怎样获胜','How to win')+'</button></section>';
}

function eventModal(readId){
 const e=readId?C.events.find(v=>v.id===readId):Game.event(s);if(!e)return;
 const live=!readId&&s.phase==='event';
 show(pick(e.title),'<div class="event-meta">'+kindName(e.kind)+(live?' · '+pick(C.cities[Game.city(s)].name)+' · '+t('掷出 '+s.roll,'Rolled '+s.roll):'')+'</div><p class="event-body">'+pick(e.body)+'</p>'+(live?'<p class="choice-prompt">'+t('你会怎么做？','What will you do?')+'</p>':'')+'<div class="options">'+e.choices.map((ch,i)=>'<button class="option event-choice" '+(live?'data-choice="'+i+'" '+(Game.player(s).money+ch.money<0?'disabled':''):'data-readchoice="'+e.id+':'+i+'"')+'><span class="choice-number">'+String.fromCharCode(65+i)+'</span><span><strong>'+pick(ch.name)+'</strong>'+delta(live?Game.eventEffect(s,ch):ch)+(live&&Game.player(s).money+ch.money<0?'<span class="option-reason">'+t('预算不足','Not enough budget')+'</span>':'')+'</span></button>').join('')+'</div>'+(live?'<p class="sub">'+t('选择立即生效。之后还可以建设、出牌或合作一次。','Your choice takes effect immediately. One build, card or cooperation action follows.')+'</p>':'')+'<details class="term-detail"><summary>'+t('认识一个当地术语','A local term')+'</summary><p><b>'+esc(e.term[0])+'</b> · '+esc(e.term[lang==='en'?2:1])+'</p></details>'+source(e.source),'event',readId);
}

function actionLock(){
 if(busy||Game.player(s).ai)return t('等待其他国家完成回合','Wait for the other countries');
 if(s.phase==='finished')return t('本局已结束','This game is complete');
 if(s.dicePending)return t('先确认骰子结果','Confirm the die result first');
 if(s.phase==='roll')return t('先掷骰并处理城市事件','Roll and resolve the city event first');
 if(s.phase==='event')return t('先处理当前城市事件','Resolve the city event first');
 if(s.phase==='feedback')return t('在决策反馈中进入行动阶段','Continue from the decision feedback');
 if(s.used)return t('本回合行动已用完','Your action is used this turn');
 return '';
}

   const markYou=humanRoles.has(r.role);

 }).join('')+'</ol></section>';
 const tray=s.dicePending?'<div class="dice-tray is-waiting"><div class="dice-mini">'+dieFlat(s.dicePending.value)+'</div><div class="dice-tray-copy"><strong>'+t('骰子已落桌 · 等待你的确认','The die settled · waiting for you')+'</strong><span>'+t('点数 ','Point ')+s.dicePending.value+t('。确认之后才会移动、发钱并进入城市事件。','. Movement, funding and the city event happen only after you confirm.')+'</span></div></div>':(s.phase==='roll'&&!busy?'<div class="dice-tray is-waiting" aria-hidden="true"><div class="dice-mini">'+dieFlat(s.roll||5)+'</div><div class="dice-tray-copy"><strong>'+t('桌面骰子 · 点击下方掷出','Table die · tap below to roll')+'</strong><span>'+t('点数决定前进站数。停稳后你会先看到结果，再点下一步进入城市事件。','The number is how many stops you move. You’ll see the result settle, then tap Next for the city event.')+'</span></div></div>':(s.roll&&['event','feedback','action'].includes(s.phase)?'<div class="dice-tray" aria-hidden="true"><div class="dice-mini">'+dieFlat(s.roll)+'</div><div class="dice-tray-copy"><strong>'+t('本回合掷出 ','This turn rolled ')+s.roll+'</strong><span>'+t('停留在 ','Now in ')+current+'</span></div></div>':''));
 return '<section class="pane desk"><div class="panel-head"><span class="mini">'+t('当前代表团','Active delegation')+'</span><button class="mini-btn" data-act="players">'+t('各国账本','Countries')+' '+ico('arrow')+'</button></div><div class="delegate-row">'+flag(p)+'<div><button class="delegate-name identity-name" data-country="'+p.role+'">'+roleName(p)+'</button><div class="sub">'+pick(role.tag)+' · '+(p.ai?t('电脑代表','Computer'):t('你来决策','Your decisions'))+'</div></div></div><p class="identity-location">'+t('当前停留：','Currently in: ')+current+' · '+pick(C.cities[Game.city(s)].country)+'</p><div class="stats">'+[['money','coin',t('预算','Budget')],['energy','energy',t('能源','Energy')],['eco','eco',t('生态','Ecology')]].map(([key,ic,label])=>'<div class="stat"><span>'+ico(ic)+label+'</span><b>'+p[key]+'</b></div>').join('')+'</div>'+tray+'<p class="turn-hint">'+stage[s.phase]+'</p><button class="cta '+(s.phase==='roll'?'cta-roll':'')+'" data-act="'+action[0]+'" '+(busy?'disabled':'')+'>'+ico(action[1])+(busy?t('其他国家正在行动…','Other countries are taking their turns…'):action[2])+'</button>'+(available?'<div class="action-links"><button class="secondary" data-view="summit">'+ico('summit')+t('商议跨国合作','Discuss cooperation')+'</button><button class="text-btn save-turn" data-act="end">'+t('保留预算，结束回合','Save budget & end turn')+'</button></div>':'')+'<div class="desk-tools"><button class="mini-btn" data-act="city">'+ico('board')+current+'</button><button class="mini-btn" data-act="coach">'+ico('audit')+t('比较可选方案','Compare options')+'</button></div><button class="ability-entry" data-country="'+p.role+'">'+t('国家行动：','National action: ')+pick(role.ability.name)+'<span>'+ (p.abilityUsed?t('本局已用','Used this game'):t('每局1次','Once per game'))+'</span></button></section>'+standings+'<section class="pane mission"><div class="panel-head"><h2>'+t('共同目标','Shared goal')+'</h2><button class="mini-btn" data-act="help" aria-label="'+t('查看胜利条件','View win conditions')+'">?</button></div><div class="goal-line"><span>'+t('欧洲生态','European ecology')+'</span><b class="number">'+Game.score(s)+' <small>/ '+Game.target(s)+'</small></b></div>'+meter(Game.score(s),Game.target(s))+'<p class="sub">'+t('每轮气候压力 −'+s.players.length*2+'；偶数轮还会发生极端天气。','Climate pressure −'+s.players.length*2+' per round, with extreme weather on even rounds.')+'</p><div class="transition-count"><span>'+t('完成双目标的国家','Countries reaching both targets')+'</span><b class="number">'+s.players.filter(p=>Game.ready(s,p)).length+' / '+Math.ceil(s.players.length/2)+'</b></div><h3 class="goal-heading">'+t('本国目标','Your country’s targets')+'</h3><div class="personal-goals">'+personal('energy',t('能源','Energy'))+personal('eco',t('生态','Ecology'))+'</div><div class="resilience-line">'+t('长期韧性','Lasting resilience')+' <span class="number">'+(p.resilience||0)+' / 3</span></div></section>';

function board(){
 const p=Game.player(s),entries=s.log.filter(e=>e.kind!=='income').slice(-3).reverse(),owned=s.players.flatMap(p=>p.owned.map(f=>f.city));
 const coach=(s.phase==='roll'&&s.round===1&&!s.started&&!Game.player(s).ai)?'<aside class="play-coach"><span class="coach-mark">1</span><div><strong>'+t('先掷骰，再处理城市事件','Roll first, then resolve the city event')+'</strong><p>'+t('右侧绿色按钮会打开骰子画面。停稳后点“下一步”，才会进入事件选择。','The green button opens the dice screen. After it settles, tap Next to enter the event.')+'</p></div></aside>':(s.phase==='action'&&!s.used&&!Game.player(s).ai?'<aside class="play-coach"><span class="coach-mark">2</span><div><strong>'+t('本回合还能行动一次','One action left this turn')+'</strong><p>'+t('建设当地项目、打出手牌、跨国合作，或使用一次国家行动——四选一。','Build locally, play a card, cooperate abroad, or use your national action — pick one.')+'</p></div></aside>':'');
 return turnGuide()+coach+'<div class="layout"><div class="left-col"><section class="board"><div class="board-head"><strong>'+ico('board')+t('欧洲路线','European circuit')+'</strong><span>'+s.stops.length+t('座城市 · 点击查看项目',' cities · select a city')+'</span></div><div class="map-scroll" tabindex="0" aria-label="'+t('可左右滑动的欧洲地图','Horizontally scrollable European map')+'">'+atlasMarkup({stops:s.stops,positions:s.players.map(p=>p.pos),active:s.active,lang,owned})+'</div><div class="board-foot"><div class="legend"><span class="leg"><i class="mark on"></i>'+t('当前城市','Current city')+'</span><span class="leg"><i class="mark"></i>'+t('路线站点','City stop')+'</span><span class="leg"><i class="line-mark"></i>'+t('掷骰路线','Travel route')+'</span></div><span class="map-location">'+t('停留在 ','Now in ')+pick(C.cities[Game.city(s)].name)+'</span><span class="mobile-hint">'+t('左右滑动地图查看其他城市','Swipe the map to see other cities')+'</span></div></section><section class="hand-wrap"><div class="sect-head"><h2>'+t('行动手牌','Your action cards')+'</h2><span class="sub">'+t('点开查看，再确认使用','Inspect, then confirm')+'</span></div><div class="hand">'+p.hand.map(id=>{const card=Game.byId(id);return '<button class="playing-card art-'+card.kind+'" data-hand="'+id+'"><span class="card-illustration" aria-hidden="true"></span><span class="card-content"><span class="card-type">'+kindName(card.kind)+'</span><b>'+pick(card.name)+'</b>'+delta(card)+'<span class="card-read">'+t('查看此牌','Inspect card')+' '+ico('arrow')+'</span></span></button>';}).join('')+'</div><p class="hand-rule sub">'+(Game.canAct(s)?t('建设、手牌、合作、国家行动共用一次行动。','Building, cards, cooperation and national actions share one action.'):s.used?t('本回合行动已使用，手牌留到之后的回合。','Your action is used. Keep these cards for a later turn.'):t('处理完城市事件后，可以使用一张手牌。','Play one card after resolving the city event.'))+'</p></section></div><aside class="right-col">'+cockpit()+window.EQAI.aiPanel()+'<section class="pane journal"><div class="panel-head"><h2>'+t('最近行动','Recent decisions')+'</h2><button class="mini-btn" data-act="journal" aria-label="'+t('查看完整记录','View full journal')+'">'+ico('history')+'</button></div><div class="journal-list">'+(entries.length?entries.map(e=>'<div class="logline"><span class="number">'+t('第'+e.round+'轮','R'+e.round)+'</span><p>'+esc(pick(e.title))+'<span class="sub"> · '+pick(C.roles[e.role].name)+'</span></p></div>').join(''):'<p class="sub">'+t('还没有行动记录。先掷骰，看看第一站会遇到什么。','No decisions yet. Roll to discover your first stop.')+'</p>')+'</div></section></aside></div>';

function catalog(){

function render(){
 header();
 $('#main').innerHTML=mast()+(view==='board'?board():view==='cards'?catalog():view==='summit'?'<section class="tool-panel"><div class="split"><h2>'+t('合作方案','Joint proposal')+'</h2><button class="text-btn" data-view="board">'+t('返回棋盘','Back to board')+'</button></div>'+EQDelegate.summit(context(),draft)+'</section>':'<section class="tool-panel"><p class="sub">'+t('面向学生社团负责人：把一局中的取舍变成一项具体的校园行动，写清目标、第一步、参与者与验证方式。这是教学练习，不用于预测真实政策或工程投资。','For student club leaders: turn the trade-offs of one game into one concrete campus action, with the goal, first step, people and a way to observe the result. A teaching exercise, not a forecasting tool for real policy or engineering investment.')+'</p><div class="split"><div class="tools-line"><button class="chip '+(setting==='campus'?'on':'')+'" data-setting="campus">'+t('校园试点','Campus pilot')+'</button><button class="chip '+(setting==='community'?'on':'')+'" data-setting="community">'+t('社区试点','Community pilot')+'</button></div><button class="primary" data-act="download">'+t('下载行动提案','Download proposal')+' ↓</button></div>'+EQDelegate.lab(context(),setting)+window.EQAI.reviewBlock()+'</section>');
 $('#foot').innerHTML='<div class="foot-inner"><span><b>Ecoquest</b> · From Climate Awareness to Collective Climate Action.</span><span>'+(storageOk?t('进度自动保存在本设备','Progress saved on this device'):t('当前浏览器无法保存进度','This browser cannot save progress'))+' · <button class="text-btn" data-act="about">'+t('项目与资料来源','About & sources')+' ↗</button></span></div>';
 document.documentElement.lang=lang==='zh'?'zh-CN':'en';EQNews.observe(s,lang,busy,modal);

 save();

function show(title,body,kind='info',data){
 modal={kind,data};const d=$('#dialog');
 const labels={event:t('城市事件','City event'),feedback:t('决策反馈','Decision feedback'),city:t('当地项目','Local projects'),hand:t('行动手牌','Action card'),setup:t('选择国家 / 新对局','Choose country / New game'),help:t('玩法指南','How to play'),results:t('本局结果','Game results')};
 d.innerHTML='<div class="dialog-inner"><div class="panel-head"><span class="mini">'+(labels[kind]||'Ecoquest · Climate Atlas')+'</span><button class="close" data-act="close" aria-label="'+t('关闭','Close')+'">'+ico('close')+'</button></div><h2 id="dialog-title">'+title+'</h2>'+body+'</div>';
 d.dataset.kind=kind;if(!d.open)d.showModal();EQNews.observe(s,lang,busy,modal);
}
function close(){hideDiceStage(); $('#dialog').close();modal=null;EQNews.observe(s,lang,busy,modal);}
function source(id){const src=C.sources[id];return src?'<details class="source policy-source"><summary>'+t('政策依据与原文','Policy context & source')+'</summary><p><b>'+esc(src.name)+'</b><br>'+pick(src.note)+'</p><a target="_blank" rel="noopener" href="'+esc(src.url)+'">'+t('阅读政策原文','Read the primary source')+' '+ico('arrow')+'</a></details>':'';}

async function runBots(){
 if(busy)return;busy=true;render();
 const aiState=window.EQAI.ensure(s);
 let turns=0;
 while(s.phase!=='finished'&&Game.player(s).ai&&turns<4){
   await new Promise(r=>setTimeout(r,320));
   try{await window.EQAI.playOpponentTurn();}
   catch(err){console.warn('AI turn failed, falling back to rules',err);Game.autoTurn(s);}
   save();turns++;
 }
 busy=false;draft={};render();if(s.phase==='finished')results();
}
async function doEnd(){
 if(busy||s.phase!=='action')return;
 const finishedRound=s.round;
 close();Game.settle(s);draft={};render();
 if(s.phase==='finished'){results();return;}
 if(Game.player(s).ai){await runBots();if(s.phase!=='finished')roundSummary(finishedRound);else results();return;}
 show(t('轮到下一位代表','Pass the device'),'<div class="delegate-row">'+flag(Game.player(s))+'<b class="delegate-name">'+roleName(Game.player(s))+'</b></div><p>'+t('请把设备交给这位代表。准备好后掷骰开始。','Pass the device to this delegation. Roll when ready.')+'</p><button class="cta" data-act="close">'+t('我已准备好','I’m ready')+' '+ico('arrow')+'</button>','handoff');
}

async function askDelegate(){
 const asked=draft,sig=EQDelegate.signature(asked);
 const finish=update=>{if(draft!==asked||EQDelegate.signature(draft)!==sig)return;Object.assign(draft,update,{aiPending:false});if(view==='summit')render();};
 let ready=false;try{ready=!!(window.EQAI&&(await window.EQAI.status()).enabled);}catch{}
 const payload=ready&&location.protocol!=='file:'?EQDelegate.negotiationPayload(context(),asked):null;
 if(!payload){finish({});return;}
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
   const response=await fetch('/api/ai/negotiate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal,cache:'no-store'});
   const data=response.ok?await response.json():null;
   if(data&&data.ok&&data.result){const r=data.result;finish({aiGoodwill:r.goodwill,aiTopics:r.topics||[],ai:{reply:r.reply,translation:r.translation,assessment:r.assessment}});}
   else{finish({});notify(t('AI 代表暂时不可用，已改用离线规则回应。','The AI delegate is unavailable; offline rules answered instead.'));}
 }catch{finish({});notify(t('AI 代表暂时不可用，已改用离线规则回应。','The AI delegate is unavailable; offline rules answered instead.'));}
 finally{clearTimeout(timer);}
}
