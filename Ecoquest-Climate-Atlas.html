document.addEventListener('click',async event=>{
 const el=event.target.closest('button,[data-city]');if(!el||el.disabled)return;
 if(el.dataset.aiDifficulty){window.EQAI.setDifficulty(el.dataset.aiDifficulty);render();return;}
 if(el.dataset.aiReview||el.dataset.aiReviewRetry){
   const label=el.textContent;
   el.textContent=t('生成中…','Generating…');
   const outcome=await window.EQAI.requestReview(!!el.dataset.aiReviewRetry);
   if(outcome&&outcome.ok){render();results();}
   else{el.textContent=label;notify(t('复盘生成失败，可重试。游戏成绩与决策记录已保留。','The review failed. You can retry; the game result and decision log are kept.'));}
   return;
 }
 if(el.dataset.aiReasonSubmit){
   const key=el.dataset.aiReasonSubmit;
   const input=document.querySelector('[data-ai-reason-for]');
   const reason=input?input.value:'';
   const log=(window.EQAI.ensure(s).log||[]).find(item=>item.key===key);
   if(!log)return;
   const outcome=await window.EQAI.requestCoach({kind:log.kind,targetId:log.targetId,chosenId:log.chosenId,
     options:log.options||[],before:log.before,after:log.after,topics:log.topics,sources:log.sources,
     text:log.text,playerReason:reason,key:key});
   if(outcome&&outcome.ok){render();notify(t('已结合你的理由重新评估。','Re-evaluated with your reason.'));}
   else notify(t('重新评估失败，保留原反馈。','The re-evaluation failed; the original note is kept.'));
   return;
 }
 if(el.dataset.view){if(busy)return;view=el.dataset.view;close();render();return;}
 if(el.dataset.country){countryProfile(el.dataset.country);return;}
 if(el.dataset.city){cityModal(el.dataset.city);return;}
 if(el.dataset.hand){handModal(el.dataset.hand);return;}
 if(el.dataset.event){eventModal(el.dataset.event);return;}
 if(el.dataset.choice!==undefined){
   const before=window.EQAI.snapshot();
   const ev=Game.event(s);
   const index=Number(el.dataset.choice);
   const options=ev?ev.choices.map((ch,i)=>({id:'event-'+i,label:pick(ch.name),effect:Game.eventEffect(s,ch),note:pick(ch.why)})):[];
   if(Game.choose(s,index)){
     render();feedback();
     void coachDecision({kind:'event',targetId:ev?ev.id:'event',chosenId:'event-'+index,options,
       before,after:window.EQAI.snapshot(),sources:ev?[ev.source]:[],
       topics:['goals','budget','ecology'],text:ev?pick(ev.title)+' '+pick(ev.body):''});
   }
   return;
 }
 if(el.dataset.readchoice){const [id,i]=el.dataset.readchoice.split(':');const e=C.events.find(e=>e.id===id);show(pick(e.choices[i].name),'<p>'+pick(e.choices[i].why)+'</p>'+delta(e.choices[i])+source(e.source),'readchoice',el.dataset.readchoice);return;}
 if(el.dataset.play){
   const before=window.EQAI.snapshot();
   const cardId=el.dataset.play;
   const card=Game.byId(cardId);
   const options=Game.player(s).hand.map(id=>{const c=Game.byId(id);return {id:'card-'+id,label:pick(c.name),effect:{money:c.money,energy:c.energy,eco:c.eco},note:pick(c.body)};});
   if(Game.playCard(s,cardId)){
     close();render();notify(t('行动已执行，手牌已补充。','Card played and hand replenished.'));
     void coachDecision({kind:'card',targetId:cardId,chosenId:'card-'+cardId,options,
       before,after:window.EQAI.snapshot(),topics:[card?card.kind:'card','goals','budget'],
       text:card?pick(card.name):cardId});
   }
   return;
 }
 if(el.dataset.build){
   const before=window.EQAI.snapshot();
   const facilityId=el.dataset.build;
   const facility=Game.facilities(s).find(f=>f.id===facilityId);
   const options=Game.facilities(s).map(f=>({id:'facility-'+f.id,label:pick(f.name),effect:{money:-f.cost,energy:f.energy,eco:f.eco},note:pick(C.cities[Game.city(s)].issue)}));
   if(Game.build(s,facilityId)){
     close();render();notify(t('项目已建成，收益将从后续回合入账。','Project built. Returns begin on future turns.'));
     void coachDecision({kind:'build',targetId:facilityId,chosenId:'facility-'+facilityId,options,
       before,after:window.EQAI.snapshot(),topics:['build','goals','budget'],
       text:facility?pick(facility.name):facilityId});
   }
   return;
 }
 if(el.dataset.filter){filter=el.dataset.filter;render();return;}
 if(el.dataset.setting){setting=el.dataset.setting;render();return;}
 if(el.dataset.config){const [key,value]=el.dataset.config.split(':');config[key]=key==='seats'?Number(value):value;if(key==='role'||key==='seats')config.opponents=Game.roster(config.role,config.seats,config.opponents).slice(1);setup();$('[data-config="'+el.dataset.config+'"]')?.focus();return;}
 if(el.dataset.opponent){const id=el.dataset.opponent,limit=config.seats===3?2:3;if(config.opponents.includes(id))config.opponents=config.opponents.filter(v=>v!==id);else if(config.opponents.length<limit)config.opponents.push(id);setup();$('[data-opponent="'+id+'"]')?.focus();return;}
 if(el.dataset.neg){
   const prior=draft;draft=EQDelegate.readDraft($('#main'));
   if(prior&&prior.aiGoodwill!=null&&!prior.aiPending&&EQDelegate.signature(prior)===EQDelegate.signature(draft))Object.assign(draft,{aiGoodwill:prior.aiGoodwill,aiTopics:prior.aiTopics,ai:prior.ai});
   if(el.dataset.neg==='preview'){draft.previewed=true;draft.aiGoodwill=null;draft.aiTopics=null;draft.ai=null;draft.aiPending=true;render();void askDelegate();}
   if(el.dataset.neg==='sign'){
     const offer=EQDelegate.offer(context(),draft);
     if(!context().canSign||!offer.accepted)return;
     const peer=s.players[offer.partner];
     if(!peer.ai)show(t('请合作方确认出资','Partner consent'),'<p>'+roleName(peer)+t('代表，请亲自确认是否同意本次出资。',' delegate, confirm this contribution yourself.')+'</p><h3>'+pick(offer.title)+'</h3><p>'+t('你方支付','Your delegation pays')+' '+offer.partnerCost+' · '+t('获得能源','Receives energy')+' +'+offer.partnerEnergy+' · '+t('生态','Ecology')+' +'+offer.partnerEco+'</p><div class="modal-actions"><button class="primary" data-act="consent">'+t('我作为合作方同意出资','I agree as the partner')+'</button><button class="secondary" data-act="close">'+t('暂不签署','Decline for now')+'</button></div>','consent');
     else if(Game.sign(s,offer)){
       const before=window.EQAI.snapshot();
       view='board';draft={};render();notify(t('跨国协议已签署，双方项目同步落地。','Agreement signed. Both delegations receive the project.'));
       void coachDecision({kind:'treaty',targetId:offer.key,chosenId:'treaty',
         options:[{id:'treaty',label:pick(offer.title),effect:{money:-offer.ownCost,energy:offer.ownEnergy,eco:offer.ownEco},note:t('我方承担 '+offer.ownCost+'，对方承担 '+offer.partnerCost+'。','Our cost '+offer.ownCost+', partner cost '+offer.partnerCost+'.')}],
         before,after:window.EQAI.snapshot(),topics:['cooperation','treaty','goals'],text:pick(offer.title)});
     }
   }return;
 }
 const action=el.dataset.act;
 if(action==='close'){close();return;}
 if(action==='language'){
   if(view==='summit')draft={...draft,...EQDelegate.readDraft($('#main')),previewed:draft.previewed};
   const old=modal;lang=lang==='zh'?'en':'zh';render();
   if(old)({event:()=>eventModal(old.data),feedback,city:()=>cityModal(old.data),hand:()=>handModal(old.data),help,players,results,setup,about,coach,journal,readchoice:()=>{close();eventModal(old.data.split(':')[0]);},handoff:close,consent:close,country:()=>countryProfile(old.data),news:()=>EQNews.open(old.data)})[old.kind]?.();
   return;
 }
 if(action==='setup'){if(!busy)setup();return;}
 if(action==='start'){if(busy)return;s=Game.newGame(config.mode,config.seats,config.role,undefined,config.opponents);view='board';draft={};close();render();notify(t('新的远征开始了。','A new expedition begins.'));return;}
 if(action==='dice-next'){confirmDice();return;}
 if(action==='roll'||action==='dice-resume'){
   if(busy||s.phase!=='roll'||Game.player(s).ai)return;
   if(action==='dice-resume'&&!s.dicePending)return;
   busy=true;
   let pending=s.dicePending;
   if(!pending){
     pending=Game.prepareRoll(s);
     diceConfirmLock=false;
     save();
   }
   if(!pending){busy=false;render();return;}
   render();
   const confirmed=await showDiceReveal(pending.value);
   busy=false;
   if(confirmed&&Game.commitRoll(s)){save();render();eventModal();}
   else render();
   return;
 }
 if(action==='resume'){if(s.phase==='event')eventModal();else if(s.phase==='feedback')feedback();return;}
 if(action==='to-action'){Game.toAction(s);close();render();return;}
 if(action==='end'){await doEnd();return;}
 if(action==='round-continue'){close();render();if(s.phase==='finished')results();return;}
 if(action==='consent'){const offer=EQDelegate.offer(context(),draft);if(Game.sign(s,offer)){close();view='board';draft={};render();notify(t('双方已确认，协议正式生效。','Both parties agreed. The project is active.'));}return;}
 if(action==='ability'){
   const before=window.EQAI.snapshot();
   const ability=C.roles[Game.player(s).role].ability;
   if(!busy&&!Game.player(s).ai&&Game.useAbility(s)){
     close();render();notify(t('国家行动已执行，本局限用一次。','National action used. Available once per game.'));
     void coachDecision({kind:'ability',targetId:'ability',chosenId:'ability',
       options:[{id:'ability',label:pick(ability.name),effect:{money:ability.money||0,energy:ability.energy||0,eco:ability.eco||0},note:pick(ability.body)}],
       before,after:window.EQAI.snapshot(),topics:['national','goals'],text:pick(ability.name)});
   }
   return;
 }
 if(action==='city'){cityModal();return;}
 if(action==='lab'){close();view='lab';render();return;}
 if(action==='download'){download();return;}
 ({help,players,results,about,coach,journal})[action]?.();
});
document.addEventListener('change',e=>{if(e.target.matches('select[data-neg-field]'))updateNegotiation();if(e.target.matches('[data-ai-adaptive]')){window.EQAI.setAdaptive(e.target.checked);render();}});
document.addEventListener('input',e=>{
 if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#search');input.focus();if(input.type!=='search')input.setSelectionRange(pos,pos);}
 if(e.target.matches('[data-neg-field="note"]')){draft.previewed=false;const button=$('[data-neg="sign"]');if(button)button.disabled=true;}
});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-city]')&&['Enter',' '].includes(e.key)){e.preventDefault();cityModal(e.target.dataset.city);}});
$('#dialog').addEventListener('cancel',()=>{modal=null;});
render();
if(!restoredGame)setup();
if(restoredGame&&s.dicePending&&s.phase==='roll'){
 busy=true;render();
 void showDiceReveal(s.dicePending.value,true).then(confirmed=>{
  busy=false;
  if(confirmed&&Game.commitRoll(s)){save();render();eventModal();}
  else render();
 });
}
if(restoredGame&&s.phase==='event')eventModal();
if(restoredGame&&s.phase==='feedback')feedback();
if(s.phase==='finished')results();
window.EQAI.ensure(s);
window.EQAI.watchStatus();
if(s.phase==='roll'&&Game.player(s).ai)runBots();


EQNews.boot(()=>({state:s,lang,busy,modal,show,save}));
</script></body></html>
